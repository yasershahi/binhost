COMMON_FLAGS="-march=native -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
EDITOR="/usr/bin/vim"
MAKEOPTS="-j4 -l4"

# USE flags
USE="-systemd -kde -gnome -wayland -pulseaudio -cups -vulkan networkmanager vaapi pipewire"

# CPU instruction set support
CPU_FLAGS_X86="mmx mmxext sse sse2 sse3 ssse3 sse4_1 sse4_2 avx aes pclmul popcnt rdrand"

# Video driver
VIDEO_CARDS="intel"

LC_MESSAGES=C.UTF-8

QEMU_SOFTMMU_TARGETS="x86_64"
QEMU_USER_TARGETS=""
LLVM_TARGETS="X86 BPF"

# Only build CPU backends we can execute (saves ~1/3 off LLVM-family builds)
LLVM_TARGETS="X86 BPF"

# Prefer official binaries where USE matches (silent source fallback otherwise)
EMERGE_DEFAULT_OPTS="--getbinpkg"
PORTAGE_BINHOST="https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64"
