name: build-binpkgs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1,15 * *"  # twice a month (matches laptop update cadence)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo (package list + portage configs)
        uses: actions/checkout@v4

      - name: Sync portage tree (fresh stage3 ships without one)
        # webrsync snapshots are atomic (no mid-sync Manifest skew) and fast;
        # plain rsync is the fallback.
        run: emerge-webrsync -q || emerge --sync -q

      - name: Add overlays (local yaser, gurov for gearlever)
        run: |
          emerge -q --oneshot dev-vcs/git
          git clone --depth 1 https://github.com/Gur0v/gurov-overlay /var/db/repos/gurov-overlay
          # gurov declares masters=guru but needs nothing from it; point at gentoo
          # to avoid cloning another huge overlay (fails loudly if it ever does need guru)
          sed -i 's/^masters.*/masters = gentoo/' /var/db/repos/gurov-overlay/metadata/layout.conf
          cp -r overlay/yaser /var/db/repos/yaser
          mkdir -p /etc/portage/repos.conf
          printf '[yaser]\nlocation = /var/db/repos/yaser\n' > /etc/portage/repos.conf/yaser.conf
          printf '[gurov-overlay]\nlocation = /var/db/repos/gurov-overlay\n' > /etc/portage/repos.conf/gurov.conf

      - name: Select profile matching the laptop
        run: eselect profile set default/linux/amd64/23.0/desktop

      - name: Install laptop portage configs
        run: |
          cp portage/make.conf /etc/portage/make.conf
          cp -r portage/package.use/. /etc/portage/package.use/
          cp -r portage/package.accept_keywords/. /etc/portage/package.accept_keywords/
          cp portage/package.license /etc/portage/package.license
          emerge --info | grep -E "USE=|VIDEO_CARDS=|LLVM_TARGETS=" | head -n 3

      - name: Runner resources
        run: |
          df -h /var/tmp /var/cache 2>/dev/null | head -n 5
          free -g | head -n 2

      - name: Smoke test (proves emerge itself works here)
        run: |
          emerge --oneshot --fetchonly --usepkg=n app-misc/fastfetch
          echo "SMOKE-OK"

      - name: Fetch all sources first (loud, isolated errors)
        run: |
          emerge --oneshot --fetchonly --usepkg=n \
            $(grep -v -E "^\s*#|^\s*$" packages.txt | tr '\n' ' ')

      - name: Build binary packages from source (never fetch)
        run: |
          emerge --oneshot --buildpkg --usepkg=n --jobs=2 --keep-going --verbose \
            $(grep -v -E "^\s*#|^\s*$" packages.txt | tr '\n' ' ')

      - name: Generate Packages index
        run: |
          emaint binhost
          cp "${GITHUB_WORKSPACE}/publish/index.html" /var/cache/binpkgs/
          ls /var/cache/binpkgs | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /var/cache/binpkgs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
