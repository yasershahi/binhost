name: build-binpkgs

# Personal offload cooker: builds binary packages for the laptop so it
# never compiles them. NOT a public binhost (unsigned, personal USE flags).
# Scope is intentionally tiny (see packages.txt) — one small job that
# finishes in minutes instead of the old 6h monster run.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"  # monthly (matches laptop update cadence)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90  # fail fast instead of burning 6h silently
    container:
      image: gentoo/stage3:latest
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo (overlay + package list + portage configs)
        uses: actions/checkout@v4

      - name: Sync portage tree (fresh stage3 ships without one)
        # webrsync snapshots are atomic (no mid-sync Manifest skew) and fast;
        # plain rsync is the fallback.
        run: emerge-webrsync -q || emerge --sync -q

      - name: Add yaser overlay (lives at repo root)
        run: |
          cp -r "${GITHUB_WORKSPACE}" /var/db/repos/yaser
          mkdir -p /etc/portage/repos.conf
          printf '[yaser]\nlocation = /var/db/repos/yaser\n' > /etc/portage/repos.conf/yaser.conf

      - name: Select profile matching the laptop
        run: eselect profile set default/linux/amd64/23.0/desktop

      - name: Install laptop portage configs
        run: |
          cp portage/make.conf /etc/portage/make.conf
          cp -r portage/package.use/. /etc/portage/package.use/
          cp -r portage/package.accept_keywords/. /etc/portage/package.accept_keywords/
          cp portage/package.license /etc/portage/package.license
          emerge --info | grep -E "USE=|PYTHON_SINGLE_TARGET" | head -n 3

      - name: Runner resources
        run: |
          df -h /var/tmp /var/cache 2>/dev/null | head -n 5
          free -g | head -n 2

      - name: Fetch sources first (loud, isolated errors)
        run: |
          emerge --oneshot --fetchonly \
            $(grep -v -E "^\s*#|^\s*$" packages.txt | tr '\n' ' ')

      - name: Build binary packages (deps from official binhost, target from source)
        # --getbinpkg (in make.conf) lets DEPS come prebuilt; --buildpkg
        # snapshots the target into /var/cache/binpkgs for publishing.
        run: |
          emerge --oneshot --buildpkg --jobs=2 --keep-going --verbose \
            $(grep -v -E "^\s*#|^\s*$" packages.txt | tr '\n' ' ')

      - name: Generate Packages index
        run: |
          emaint binhost
          cp "${GITHUB_WORKSPACE}/publish/index.html" /var/cache/binpkgs/
          ls /var/cache/binpkgs | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /var/cache/binpkgs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
