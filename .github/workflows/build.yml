name: build-binpkgs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1,15 * *"  # twice a month (matches laptop update cadence)

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: gentoo/stage3:latest
      options: --privileged
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo (package list + portage configs)
        uses: actions/checkout@v4

      - name: Sync portage tree (fresh stage3 ships without one)
        # webrsync snapshots are atomic (no mid-sync Manifest skew) and fast;
        # plain rsync is the fallback.
        run: emerge-webrsync -q || emerge --sync -q

      - name: Add overlays (local yaser)
        run: |
          cp -r overlay/yaser /var/db/repos/yaser
          mkdir -p /etc/portage/repos.conf
          printf '[yaser]\nlocation = /var/db/repos/yaser\n' > /etc/portage/repos.conf/yaser.conf

      - name: Select profile matching the laptop
        run: eselect profile set default/linux/amd64/23.0/desktop

      - name: Install laptop portage configs
        run: |
          cp portage/make.conf /etc/portage/make.conf
          cp -r portage/package.use/. /etc/portage/package.use/
          cp -r portage/package.accept_keywords/. /etc/portage/package.accept_keywords/
          cp portage/package.license /etc/portage/package.license
          emerge --info | grep -E "USE=|VIDEO_CARDS=|LLVM_TARGETS=" | head -n 3

      - name: Build binary packages from source (never fetch)
        run: |
          emerge --oneshot --buildpkg --usepkg=n --jobs=2 \
            $(grep -v -E "^\s*#|^\s*$" packages.txt | tr '\n' ' ')

      - name: Generate Packages index
        run: |
          emaint binhost
          ls /var/cache/binpkgs | head

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /var/cache/binpkgs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
